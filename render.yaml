# Render Blueprint — single-container deploy (frontend + backend in one web service)

services:
  - type: web
    name: kspdb-control-room
    runtime: docker
    repo: https://github.com/Pushkrajpnaik/Propel_assignment
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kspdb-db
          property: connectionString
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"

databases:
  - name: kspdb-db
    plan: free
    region: singapore
    postgresMajorVersion: "15"
    databaseName: kspdb
    user: kspdb
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
